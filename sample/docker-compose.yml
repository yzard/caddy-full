services:
  caddy:
    build: ..
    image: caddy-full:local
    restart: unless-stopped
    # To forward Syncthing on TCP 443, add this label to the proxy:
    # labels:
    #   bep_host_port: "syncthing:22000"
    environment:
      FALLBACK_PROXY: ${FALLBACK_PROXY:-}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      UMASK: ${UMASK:-022}
      TZ: ${TZ:-UTC}
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro
      - ./volume:/etc/caddy
      - ./data:/data
    ports:
      - "80:80"
      - "443:443"

  whoami:
    image: nginx:alpine
    labels:
      caddy.0.domain: test1.localhost test2.localhost
      caddy.0.port: "80"
      caddy.0.tls: internal

  whoami2:
    image: nginx:alpine
    labels:
      caddy.0.domain: test3.localhost
      caddy.0.paths: foo:80,bar:80
      caddy.0.tls: internal
